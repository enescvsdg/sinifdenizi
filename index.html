<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SınıfDenizi — Öğren. Kazan. Büyüt.</title>
<style>
:root{--navy:#063568;--blue:#0877df;--cyan:#20c6e8;--bg:#f4f9ff;--card:#fff;--text:#0c2b4c;--muted:#6d8196;--line:#dceaf6;--green:#1eb980;--orange:#ff8a33}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#eef7ff;color:var(--blue);border:1px solid #cce4f8}.hidden{display:none!important}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:24px}.brand i{font-style:normal;font-size:30px}.login{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr}.hero{padding:60px;color:#fff;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 70% 20%,#39d4f1 0,transparent 30%),linear-gradient(145deg,#0476d8,#063f86 65%,#032b5f);position:relative;overflow:hidden}.hero:after{content:'🪸  🌿  🐚  🪨  🫧  🐠  🌊';position:absolute;bottom:20px;left:28px;font-size:48px;opacity:.95}.hero h1{font-size:64px;line-height:1;margin:28px 0 16px}.hero p{max-width:560px;font-size:19px;line-height:1.6}.login-panel{display:grid;place-items:center;padding:30px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 70px #0d4c7e20}.tabs{display:flex;background:#f0f7fd;border-radius:12px;padding:4px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px}.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 3px 10px #173e6020}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cfe0ef;border-radius:10px;background:#fff}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:#062f60;color:#d9ebff;padding:18px;display:flex;flex-direction:column}.sidebar .brand{color:#fff}.nav{margin-top:24px;display:grid;gap:6px}.nav button{border:0;background:transparent;color:#d7ebff;padding:12px;text-align:left;border-radius:10px}.nav button.active,.nav button:hover{background:#0b70d8;color:white}.side-bottom{margin-top:auto}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 20px;position:sticky;top:0;z-index:5}.chip{background:#f2f8fd;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-weight:700}.spacer{flex:1}.content{padding:22px}.title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.title h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #15466e0b}.metric strong{font-size:26px;display:block}.metric span{font-size:13px;color:var(--muted)}.aquarium{position:relative;height:560px;border-radius:24px;overflow:hidden;background:linear-gradient(#1cc8ef 0,#0873c7 42%,#03508e 72%,#033868 100%);box-shadow:inset 0 0 80px #001f4a70}.aquarium:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,#ffffff70,transparent 40%),linear-gradient(115deg,transparent 0 45%,#ffffff14 46% 48%,transparent 49% 100%)}.floor{position:absolute;left:0;right:0;bottom:0;height:95px;background:linear-gradient(#dcb66c,#a67d40);border-radius:45% 45% 0 0}.decor{position:absolute;bottom:35px;font-size:54px;filter:drop-shadow(0 7px 5px #002c4b55)}.fish{position:absolute;user-select:none;will-change:transform}.fish .emoji{font-size:54px;filter:drop-shadow(0 7px 5px #00335266)}.tag{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:#07345edd;color:#fff;border-radius:10px;padding:4px 8px;font-size:12px;white-space:nowrap;opacity:0;transition:.2s}.fish:hover .tag{opacity:1}.bubble{position:absolute;border:2px solid #d7f8ffcc;border-radius:50%;opacity:.6;animation:rise linear infinite}@keyframes rise{to{transform:translateY(-680px);opacity:0}}.aq-tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.progress{height:9px;background:#e5eef7;border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef3f7}.row:last-child{border:0}.grow{flex:1}.badge{background:#eaf7ff;color:#0877df;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#edf6fd;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf2f7}.modal-bg{position:fixed;inset:0;background:#001d3e80;display:grid;place-items:center;z-index:50;padding:20px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.picker{display:flex;gap:8px;flex-wrap:wrap}.picker button{font-size:28px;border:2px solid transparent;background:#f2f8fd;border-radius:12px;padding:8px}.picker button.sel{border-color:var(--blue)}.parent{max-width:1120px;margin:auto;padding:24px}.parent-hero{background:linear-gradient(120deg,#057ad5,#16bddf);color:white;border-radius:24px;padding:25px;display:flex;align-items:center;gap:18px}.parent-hero .avatar{width:82px;height:82px;font-size:42px}.fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border-radius:0!important;z-index:100}.fullscreen .tag{opacity:.8}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.sidebar{display:none}.g4,.g3{grid-template-columns:1fr 1fr}.topbar{overflow:auto}.aquarium{height:500px}}@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}.content{padding:12px}.aquarium{height:460px}.chip{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const FISH=['🐠','🐟','🐡','🦈','🐢','🐬','🐙','🪼','🦑','🦀'];
const base={role:'teacher',teacher:'Ayşe Yılmaz',className:'4-A Sınıfı',participation:72,decor:4,students:[['Ali Demir','🐠',6,28,42,5],['Zeynep Kaya','🐢',5,25,39,4],['Mert Arslan','🦈',5,24,34,4],['Elif Şahin','🐟',4,22,31,3],['Eren Yıldız','🐡',4,20,28,3],['Defne Arslan','🐬',4,19,27,3],['Arda Çetin','🦑',3,18,24,2],['Duru Koç','🐙',3,16,20,2],['Cem Akın','🪼',3,15,19,2],['Berra Işık','🦀',2,12,17,1]].map((x,i)=>({id:i+1,name:x[0],fish:x[1],level:x[2],completed:x[3],feed:x[4],badges:x[5],photo:''})),tasks:[{title:'Matematik çalışma kağıdı',type:'Ödev',xp:50,feed:10,due:'22 Eylül'},{title:'20 dakika kitap oku',type:'Okuma',xp:30,feed:6,due:'23 Eylül'},{title:'Sınıf panosuna katkı',type:'Katılım',xp:40,feed:8,due:'25 Eylül'}]};
let s=JSON.parse(localStorage.getItem('sd-v1')||'null')||base,page='dashboard',anim=0,agents=[];const app=document.querySelector('#app');const save=()=>localStorage.setItem('sd-v1',JSON.stringify(s));
function login(){app.innerHTML=`<div class="login"><section class="hero"><div class="brand"><i>🐠</i>SınıfDenizi</div><h1>Öğren.<br>Kazan.<br>Büyüt.</h1><p>Bireysel başarı öğrencinin balığını, sınıfın ortak başarısı ise bütün denizi geliştirir.</p></section><section class="login-panel"><div class="login-card"><div class="brand"><i>🐠</i>SınıfDenizi</div><h2>Hoş geldiniz</h2><div class="tabs"><button class="active" data-r="teacher">Öğretmen</button><button data-r="parent">Veli</button></div><div class="field"><label>E-posta</label><input value="ogretmen@sinifdenizi.com"></div><div class="field"><label>Şifre</label><input type="password" value="demo1234"></div><button id="go" class="btn primary" style="width:100%">Giriş Yap</button><p class="muted">Demo sürümünde parola doğrulaması yoktur.</p></div></section></div>`;let role='teacher';document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('active',x===b))});go.onclick=()=>{s.role=role;save();role==='teacher'?teacher():parent()}}
const nav=(t,p)=>`<button data-p="${p}" class="${page===p?'active':''}">${t}</button>`;
function shell(body){cancelAnimationFrame(anim);agents=[];app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><i>🐠</i>SınıfDenizi</div><div class="nav">${nav('⌂ Ana Sayfa','dashboard')}${nav('🐟 Sınıf Akvaryumu','aquarium')}${nav('👥 Öğrenciler','students')}${nav('✓ Görevler','tasks')}${nav('🏅 Rozetler','badges')}${nav('▥ Raporlar','reports')}</div><div class="side-bottom"><b>${s.teacher}</b><br><small>Sınıf Öğretmeni</small><br><button id="out" class="btn secondary" style="margin-top:12px">Çıkış</button></div></aside><main class="main"><header class="topbar"><span class="chip">${s.className}</span><span class="chip">⭐ Seviye ${s.decor}</span><span class="chip">🐟 ${s.students.length} Öğrenci</span><span class="chip">✓ ${s.tasks.length} Görev</span><div class="spacer"></div><button id="fullTop" class="btn secondary">⛶ Tam Ekran</button></header><div class="content">${body}</div></main></div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;teacher()});out.onclick=login;fullTop.onclick=()=>{page='aquarium';teacher();setTimeout(fullscreen,80)}}
const metric=(a,b)=>`<div class="card metric"><strong>${a}</strong><span>${b}</span></div>`;
function teacher(){({dashboard, aquarium, students, tasks, badges, reports}[page]||dashboard)()}
function dashboard(){shell(`<div class="title"><div><h2>Merhaba, ${s.teacher.split(' ')[0]} Öğretmen 👋</h2><div class="muted">Sınıfınızın güncel durumu</div></div><button class="btn primary" onclick="taskModal()">+ Yeni Görev</button></div><div class="grid g4">${metric(s.students.length,'Öğrenci')}${metric(s.tasks.length,'Aktif görev')}${metric('%'+s.participation,'Katılım')}${metric(s.students.reduce((a,x)=>a+x.feed,0),'Toplam yem')}</div><h2>Sınıf Akvaryumu</h2><div class="card"><div id="aq" class="aquarium" style="height:420px"></div></div>`);setTimeout(()=>makeAq('aq',true),30)}
function aquarium(){shell(`<div class="title"><div><h2>Sınıf Akvaryumu</h2><div class="muted">Balıklar serbestçe gezer; birbirlerinden ve kenarlardan uzaklaşır.</div></div></div><div class="aq-tools"><button class="btn secondary" onclick="feedAll()">🐟 Yem Ver</button><button class="btn secondary" onclick="decorModal()">🪸 Dekorasyonlar</button><button class="btn primary" onclick="fullscreen()">⛶ Tam Ekran</button></div><div id="aq" class="aquarium"></div><h2>Toplu başarı</h2><div class="grid g3">${['Başlangıç','Keşif','Gelişim','Zenginleşme','Işıltılı Deniz','Efsane Akvaryum'].map((x,i)=>`<div class="card"><b>Seviye ${i+1}</b><h3>${x}</h3><div class="muted">${i<s.decor?'✓ Açıldı':'🔒 Sınıf başarısıyla açılır'}</div></div>`).join('')}</div>`);setTimeout(()=>makeAq('aq'),30)}
function makeAq(id,compact=false){const aq=document.getElementById(id);if(!aq)return;aq.innerHTML='<div class="floor"></div>';['🪸','🌿','🪨','⚓','💰','🏛️','🌿'].slice(0,s.decor+2).forEach((d,i)=>{let e=document.createElement('div');e.className='decor';e.textContent=d;e.style.left=(5+i*14)+'%';aq.append(e)});for(let i=0;i<18;i++){let b=document.createElement('i');b.className='bubble';let z=8+Math.random()*15;b.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;bottom:${Math.random()*80}px;animation-duration:${5+Math.random()*7}s`;aq.append(b)}const box=aq.getBoundingClientRect();agents=s.students.map((st,i)=>{let el=document.createElement('div');el.className='fish';el.innerHTML=`<span class="tag">${st.name}</span><span class="emoji">${st.fish}</span>`;aq.append(el);return{el,st,x:40+Math.random()*(box.width-120),y:45+Math.random()*(box.height-150),vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*.8}});function tick(){const r=aq.getBoundingClientRect();for(let a of agents){for(let b of agents){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<90&&d>0){a.vx+=dx/d*.015;a.vy+=dy/d*.01}}if(a.x<15)a.vx+=.05;if(a.x>r.width-90)a.vx-=.05;if(a.y<25)a.vy+=.04;if(a.y>r.height-120)a.vy-=.04;a.vx=Math.max(-1.6,Math.min(1.6,a.vx));a.vy=Math.max(-1,Math.min(1,a.vy));a.x+=a.vx;a.y+=a.vy;a.el.style.transform=`translate(${a.x}px,${a.y}px) scaleX(${a.vx<0?-1:1})`}anim=requestAnimationFrame(tick)}tick()}
function fullscreen(){const aq=document.getElementById('aq');if(!aq)return;aq.classList.toggle('fullscreen');setTimeout(()=>makeAq('aq'),80)}
function feedAll(){s.students.forEach(x=>x.feed++);save();alert('Tüm balıklara yem verildi 🐟')}
function students(){shell(`<div class="title"><h2>Öğrenciler</h2><button class="btn primary" onclick="studentModal()">+ Öğrenci Ekle</button></div><div class="card"><table class="table"><thead><tr><th>Öğrenci</th><th>Balık</th><th>Seviye</th><th>Görev</th><th>Yem</th></tr></thead><tbody>${s.students.map(x=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="avatar">${x.photo?`<img src="${x.photo}">`:'👦🏻'}</div><b>${x.name}</b></div></td><td style="font-size:28px">${x.fish}</td><td>${x.level}</td><td>${x.completed}</td><td>${x.feed}</td></tr>`).join('')}</tbody></table></div>`)}
function tasks(){shell(`<div class="title"><h2>Görevler</h2><button class="btn primary" onclick="taskModal()">+ Yeni Görev</button></div>${s.tasks.map(t=>`<div class="card row"><div style="font-size:28px">${t.type==='Okuma'?'📖':'✅'}</div><div class="grow"><b>${t.title}</b><div class="muted">${t.type} · ${t.due}</div></div><span class="badge">+${t.xp} XP</span><span class="badge">+${t.feed} 🐟</span></div>`).join('')}`)}
function badges(){shell(`<div class="title"><h2>Rozetler & Sınıf Hedefleri</h2></div><div class="grid g3">${['⭐ İlk Görev','📚 Kitap Kurdu','🏆 Süper Katılım','💚 Yardımsever','🎯 Hedef Ustası','🌊 Deniz Kaşifi'].map(x=>`<div class="card"><div style="font-size:42px">${x.split(' ')[0]}</div><h3>${x.slice(x.indexOf(' ')+1)}</h3><div class="muted">Başarılarla açılır</div></div>`).join('')}</div>`)}
function reports(){shell(`<div class="title"><h2>Raporlar</h2></div><div class="grid g3">${metric('%'+s.participation,'Ortalama katılım')}${metric(s.students.reduce((a,x)=>a+x.completed,0),'Tamamlanan görev')}${metric(s.students.reduce((a,x)=>a+x.badges,0),'Toplam rozet')}</div><div class="card" style="margin-top:16px"><h3>En aktif öğrenciler</h3>${[...s.students].sort((a,b)=>b.completed-a.completed).slice(0,6).map((x,i)=>`<div class="row"><b>${i+1}</b><div class="grow">${x.name}</div><b>${x.completed} görev</b></div>`).join('')}</div>`)}
function modal(html){let d=document.createElement('div');d.className='modal-bg';d.innerHTML=`<div class="modal"><div style="display:flex"><b>SınıfDenizi</b><div class="spacer"></div><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">×</button></div>${html}</div>`;document.body.append(d);return d}
function taskModal(){let m=modal(`<h2>Yeni Görev</h2><div class="field"><label>Başlık</label><input id="tt"></div><div class="field"><label>Tür</label><select id="ty"><option>Ödev</option><option>Okuma</option><option>Katılım</option><option>Proje</option></select></div><div class="grid g3"><div class="field"><label>XP</label><input id="tx" type="number" value="50"></div><div class="field"><label>Yem</label><input id="tf" type="number" value="10"></div><div class="field"><label>Son tarih</label><input id="td" value="27 Eylül"></div></div><button id="ts" class="btn primary">Kaydet</button>`);m.querySelector('#ts').onclick=()=>{let title=m.querySelector('#tt').value.trim();if(!title)return;s.tasks.push({title,type:m.querySelector('#ty').value,xp:+m.querySelector('#tx').value,feed:+m.querySelector('#tf').value,due:m.querySelector('#td').value});save();m.remove();teacher()}}
function studentModal(){let photo='',fish='🐠';let m=modal(`<h2>Yeni Öğrenci</h2><div class="field"><label>Ad Soyad</label><input id="sn"></div><div class="field"><label>Profil Fotoğrafı</label><input id="sp" type="file" accept="image/*"></div><div class="field"><label>Balık seç</label><div class="picker">${FISH.map((f,i)=>`<button data-f="${f}" class="${i?'':'sel'}">${f}</button>`).join('')}</div></div><button id="ss" class="btn primary">Öğrenciyi Kaydet</button>`);m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fish=b.dataset.f;m.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('sel',x===b))});m.querySelector('#sp').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>photo=r.result;r.readAsDataURL(f)};m.querySelector('#ss').onclick=()=>{let name=m.querySelector('#sn').value.trim();if(!name)return;s.students.push({id:Date.now(),name,fish,photo,level:1,completed:0,feed:0,badges:0});save();m.remove();teacher()}}
function decorModal(){modal(`<h2>Akvaryum Dekorasyonları</h2><p class="muted">Sınıfın toplu başarısı arttıkça dekorasyonlar otomatik açılır.</p><div class="grid g3">${['🪨 Kaya','🌿 Yosun','🪸 Mercan','⚓ Batık Gemi','💰 Hazine','🏛️ Deniz Kalesi'].map((x,i)=>`<div class="card"><div style="font-size:44px">${x.split(' ')[0]}</div><b>${x.slice(x.indexOf(' ')+1)}</b><div class="muted">${i<s.decor?'✓ Açıldı':'🔒 Kilitli'}</div></div>`).join('')}</div>`)}
function parent(){let x=s.students[0];app.innerHTML=`<div class="parent"><header style="display:flex;align-items:center;margin-bottom:18px"><div class="brand"><i>🐠</i>SınıfDenizi</div><div class="spacer"></div><button class="btn secondary" onclick="login()">Çıkış</button></header><div class="parent-hero"><div class="avatar">${x.photo?`<img src="${x.photo}">`:'👦🏻'}</div><div><small>Çocuğunuzun gelişimi</small><h1 style="margin:4px 0">${x.name}</h1><div>${s.className} · Seviye ${x.level} · ${x.fish}</div></div></div><div class="grid g4" style="margin-top:16px">${metric(x.completed,'Tamamlanan görev')}${metric(4,'Bekleyen görev')}${metric(x.badges,'Rozet')}${metric(x.feed,'Yem')}</div><div class="grid g3" style="margin-top:16px"><div class="card" style="grid-column:span 2"><h2>Görev durumu</h2>${s.tasks.map((t,i)=>`<div class="row"><span>${i?'⏳':'✅'}</span><div class="grow"><b>${t.title}</b><div class="muted">${i?'Devam ediyor':'Tamamlandı'} · ${t.due}</div></div></div>`).join('')}</div><div class="card"><h2>Öğretmenden</h2><p>${x.name.split(' ')[0]} düzenli ilerliyor ve görev katılımı oldukça güzel.</p></div></div><div class="card" style="margin-top:16px"><h2>Sınıf Denizi</h2><div id="paq" class="aquarium" style="height:380px"></div></div></div>`;setTimeout(()=>makeAq('paq',true),30)}
login();
</script></body></html>
