<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SınıfDenizi — Öğren. Kazan. Büyüt.</title>
<style>
:root{--navy:#052f63;--blue:#0878df;--cyan:#22c5e9;--bg:#f3f8fd;--text:#12304f;--muted:#71879d;--line:#dbe9f5;--green:#20b982;--gold:#ffbd35}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}.primary{background:linear-gradient(135deg,#0878df,#0aa6e7);color:#fff}.secondary{background:#eef7ff;color:#0878df;border:1px solid #cde4f5}.brand{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:900}.logoFish{width:38px;height:28px}.login{min-height:100vh;display:grid;grid-template-columns:1.25fr .9fr}.hero{padding:60px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 15%,#72eaff88,transparent 26%),linear-gradient(145deg,#0a8fe5,#075ba7 55%,#073b72)}.hero:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-70px;height:210px;background:radial-gradient(circle at 15% 20%,#ff8d55 0 10px,transparent 11px),radial-gradient(circle at 35% 35%,#16a66e 0 17px,transparent 18px),radial-gradient(circle at 55% 10%,#fb5f7c 0 13px,transparent 14px),radial-gradient(circle at 76% 35%,#16a66e 0 20px,transparent 21px),linear-gradient(#16a0b955,#064875);border-radius:50% 50% 0 0}.hero h1{font-size:64px;line-height:1;margin:28px 0 16px}.hero p{max-width:620px;font-size:19px;line-height:1.65}.loginPanel{display:grid;place-items:center;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 35px #154c7620}.loginCard{width:min(430px,100%);padding:28px}.tabs{display:flex;background:#eef6fc;padding:4px;border-radius:12px;margin:22px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800}.tabs .active{background:#fff;color:var(--blue);box-shadow:0 3px 10px #18466b18}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cfe0ee;border-radius:10px;background:#fff}.shell{min-height:100vh;display:grid;grid-template-columns:224px 1fr}.sidebar{background:linear-gradient(#052f63,#06264e);color:#dcebfa;padding:18px;display:flex;flex-direction:column}.sidebar .brand{color:#fff}.nav{margin-top:24px;display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dcebfa;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#0878df;color:#fff}.sideBottom{margin-top:auto}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:5}.chip{background:#f3f9fe;border:1px solid var(--line);padding:9px 12px;border-radius:11px;font-weight:800;white-space:nowrap}.spacer{flex:1}.content{padding:22px}.title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.title h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.metric{padding:18px}.metric strong{display:block;font-size:27px}.metric span{font-size:13px;color:var(--muted)}.panel{padding:18px}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf3f8}.row:last-child{border:0}.grow{flex:1}.badge{background:#eaf6ff;color:#0878df;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#eaf5fd;overflow:hidden;font-weight:900;color:#0d6dbf}.avatar img{width:100%;height:100%;object-fit:cover}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf2f7}.aqTools{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}.aquarium{position:relative;height:610px;border-radius:26px;overflow:hidden;background:linear-gradient(#29c9ef 0,#128ed0 28%,#0767a6 56%,#064a82 80%,#073962 100%);box-shadow:inset 0 0 100px #002b5566,0 16px 38px #164c6e20}.aquarium:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,#ffffffb8 0 7%,transparent 34%),linear-gradient(110deg,transparent 0 39%,#ffffff18 40% 42%,transparent 43% 100%);pointer-events:none}.waterGlow{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#32dbef22,transparent 45%);pointer-events:none}.seabed{position:absolute;left:-5%;right:-5%;bottom:-55px;height:180px;border-radius:45% 55% 0 0;background:linear-gradient(#f5d295,#c89255 55%,#8f6739);box-shadow:inset 0 18px 25px #fff4}.rock{position:absolute;bottom:48px;width:110px;height:70px;background:linear-gradient(145deg,#587e88,#2e5968);border-radius:55% 45% 35% 40%;box-shadow:inset 12px 10px 0 #6f929b55}.plant{position:absolute;bottom:60px;width:14px;height:90px;background:linear-gradient(#23bf84,#0b7958);border-radius:50% 50% 10px 10px;transform-origin:bottom}.plant:before,.plant:after{content:"";position:absolute;width:12px;height:55px;background:inherit;border-radius:50%;bottom:0}.plant:before{left:-18px;transform:rotate(-26deg)}.plant:after{left:18px;transform:rotate(26deg)}.coral{position:absolute;bottom:56px;width:18px;height:80px;background:#fb6b7f;border-radius:12px}.coral:before,.coral:after{content:"";position:absolute;width:16px;height:48px;background:inherit;border-radius:12px;bottom:12px}.coral:before{left:-16px;transform:rotate(-38deg)}.coral:after{left:18px;transform:rotate(38deg)}.wreck{position:absolute;bottom:62px;left:36%;width:170px;height:60px;border:12px solid #704d2a;border-top-width:22px;border-radius:8px 8px 28px 28px;transform:rotate(-7deg);opacity:.9}.wreck:before{content:"";position:absolute;width:10px;height:120px;background:#6b492b;left:60px;bottom:20px;transform:rotate(7deg)}.treasure{position:absolute;right:8%;bottom:62px;width:92px;height:62px;background:linear-gradient(#7e4a20,#523015);border:5px solid #d7a33b;border-radius:10px 10px 18px 18px;box-shadow:0 0 28px #ffd55a66}.treasure:before{content:"";position:absolute;left:10px;right:10px;top:-8px;height:22px;background:#d9ad3f;border-radius:50%}.bubble{position:absolute;border:2px solid #dffaffcc;border-radius:50%;opacity:.65;animation:rise linear infinite}@keyframes rise{to{transform:translateY(-760px);opacity:0}}.fishAgent{position:absolute;width:108px;height:72px;user-select:none;will-change:transform;filter:drop-shadow(0 8px 8px #00375d77)}.fishAgent svg{width:100%;height:100%;overflow:visible}.fishTag{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:#062f60e8;color:white;padding:5px 9px;border-radius:11px;font-size:12px;font-weight:800;white-space:nowrap;opacity:0;transition:.2s}.fishAgent:hover .fishTag,.fullscreen .fishTag{opacity:.9}.fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border-radius:0!important;z-index:100}.modalBg{position:fixed;inset:0;background:#001d3e88;display:grid;place-items:center;z-index:50;padding:20px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.fishPicker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fishPick{border:2px solid transparent;background:#f2f8fd;border-radius:14px;padding:10px;text-align:center}.fishPick.sel{border-color:var(--blue);background:#e8f4ff}.fishPick svg{width:90px;height:58px}.parent{max-width:1160px;margin:auto;padding:24px}.parentHero{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#0878df,#22c5e9);color:#fff;padding:24px;border-radius:24px}.parentHero .avatar{width:80px;height:80px;font-size:28px}.progress{height:9px;background:#e3edf5;border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:linear-gradient(90deg,#0878df,#22c5e9)}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.sidebar{display:none}.g4,.g3{grid-template-columns:1fr 1fr}.topbar{overflow:auto}.aquarium{height:520px}}@media(max-width:580px){.g4,.g3{grid-template-columns:1fr}.content{padding:12px}.aquarium{height:470px}.chip{display:none}.fishPicker{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div>
<script>
const TYPES=['clown','blue','yellow','butterfly','puffer','turtle','ray','seahorse'];
const TYPE_NAMES={clown:'Palyaço Balığı',blue:'Mavi Tang',yellow:'Sarı Tang',butterfly:'Kelebek Balığı',puffer:'Dikenli Balon Balığı',turtle:'Deniz Kaplumbağası',ray:'Manta Vatoz',seahorse:'Denizatı'};
function fishSVG(t){const eye='<circle cx="71" cy="29" r="5" fill="#fff"/><circle cx="72" cy="29" r="2.4" fill="#08243d"/>';if(t==='turtle')return `<svg viewBox="0 0 110 70"><ellipse cx="57" cy="36" rx="31" ry="22" fill="#6bbf79"/><path d="M35 24Q57 8 79 24Q67 28 57 44Q47 28 35 24Z" fill="#3d7650" opacity=".8"/><circle cx="88" cy="34" r="11" fill="#87d08f"/>${eye.replaceAll('71','90').replaceAll('72','91').replaceAll('29','32')}<path d="M31 27Q8 14 18 36Q8 52 34 45" fill="#77c887"/><ellipse cx="49" cy="58" rx="17" ry="7" fill="#77c887" transform="rotate(-18 49 58)"/><ellipse cx="55" cy="14" rx="17" ry="7" fill="#77c887" transform="rotate(12 55 14)"/></svg>`;if(t==='ray')return `<svg viewBox="0 0 120 70"><path d="M9 37Q34 4 61 25Q89 3 111 37Q86 31 64 51Q35 31 9 37Z" fill="#5f7fc7"/><path d="M60 48Q76 57 108 61" stroke="#375b9f" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="55" cy="28" r="3" fill="#fff"/><circle cx="55" cy="28" r="1.4" fill="#10233d"/><circle cx="68" cy="28" r="3" fill="#fff"/><circle cx="68" cy="28" r="1.4" fill="#10233d"/></svg>`;if(t==='seahorse')return `<svg viewBox="0 0 80 100"><path d="M45 12Q65 11 61 29Q58 40 47 42Q54 53 50 67Q46 84 28 79Q15 75 22 64Q26 58 33 63Q37 68 31 70Q40 73 41 61Q42 50 35 42Q26 33 33 21Q36 15 45 12Z" fill="#f39a33"/><path d="M37 20Q25 14 26 30Q30 28 36 29" fill="#d97526"/><circle cx="51" cy="22" r="4" fill="#fff"/><circle cx="52" cy="22" r="2" fill="#1c2c3b"/><path d="M58 26L74 31L58 35Z" fill="#ffbd55"/></svg>`;if(t==='puffer')return `<svg viewBox="0 0 110 70"><g fill="#d89b55">${[20,30,40,50,60,70,80].map((x,i)=>`<path d="M${x} ${i%2?16:10}l4 10h-8z"/>`).join('')}</g><ellipse cx="56" cy="38" rx="36" ry="27" fill="#e8bd78"/><path d="M23 33L5 22L8 43Z" fill="#c88b4e"/>${eye}<circle cx="70" cy="45" r="3" fill="#8c5d38"/><circle cx="44" cy="27" r="3" fill="#9c6a3b"/><circle cx="48" cy="49" r="2.8" fill="#9c6a3b"/></svg>`;let body='#ff7f32',fin='#f35b25',stripe='#fff';if(t==='blue'){body='#2767d8';fin='#ffd42f';stripe='#082d74'}if(t==='yellow'){body='#ffd338';fin='#f4b61e';stripe='#f8e779'}if(t==='butterfly'){body='#f6d550';fin='#1d3557';stripe='#fff'}return `<svg viewBox="0 0 120 70"><path d="M24 35L3 17L7 53Z" fill="${fin}"/><ellipse cx="61" cy="35" rx="42" ry="27" fill="${body}"/><path d="M50 10Q60 2 70 11" fill="${fin}"/><path d="M52 60Q64 68 74 58" fill="${fin}"/>${t==='clown'?'<path d="M43 12Q37 35 44 58" stroke="#fff" stroke-width="9"/><path d="M75 12Q69 35 76 58" stroke="#fff" stroke-width="8"/><path d="M43 12Q37 35 44 58" stroke="#202a35" stroke-width="1.5"/><path d="M75 12Q69 35 76 58" stroke="#202a35" stroke-width="1.5"/>':''}${t==='blue'?'<path d="M33 19Q62 7 88 25Q69 34 39 29Z" fill="#082d74"/><path d="M39 43Q66 53 87 38Q63 64 39 52Z" fill="#082d74"/>':''}${t==='butterfly'?'<path d="M46 10Q39 35 47 59" stroke="#fff" stroke-width="10"/><path d="M65 9Q58 35 66 61" stroke="#24334b" stroke-width="8"/>':''}${eye}<path d="M92 42Q99 46 104 40" stroke="#7b2f2f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`}
function logo(){return `<svg class="logoFish" viewBox="0 0 120 70">${fishSVG('clown').match(/<svg[^>]*>(.*)<\/svg>/s)[1]}</svg>`}
const defaults={role:'teacher',teacher:'Ayşe Yılmaz',className:'4-A Sınıfı',participation:82,decor:4,students:[['Ali Demir','clown',6,28,42,5],['Zeynep Kaya','turtle',5,25,39,4],['Mert Arslan','ray',5,24,34,4],['Elif Şahin','butterfly',4,22,31,3],['Eren Yıldız','puffer',4,20,28,3],['Defne Arslan','blue',4,19,27,3],['Arda Çetin','seahorse',3,18,24,2],['Duru Koç','yellow',3,16,20,2]].map((x,i)=>({id:i+1,name:x[0],fish:x[1],level:x[2],completed:x[3],feed:x[4],badges:x[5],photo:''})),tasks:[{title:'Matematik çalışma kağıdı',type:'Ödev',xp:50,feed:10,due:'22 Eylül'},{title:'20 dakika kitap oku',type:'Okuma',xp:30,feed:6,due:'23 Eylül'},{title:'Sınıf panosuna katkı',type:'Katılım',xp:40,feed:8,due:'25 Eylül'}]};
let s=JSON.parse(localStorage.getItem('sd-v2')||'null')||defaults,page='dashboard',anim=0,agents=[];const app=document.getElementById('app');const save=()=>localStorage.setItem('sd-v2',JSON.stringify(s));
function login(){app.innerHTML=`<div class="login"><section class="hero"><div class="brand">${logo()}SınıfDenizi</div><h1>Öğren.<br>Kazan.<br>Büyüt.</h1><p>Her öğrencinin kendi balığı, her sınıfın ortak bir denizi var. Görevler tamamlandıkça öğrenciler gelişir; sınıf birlikte başardıkça akvaryum zenginleşir.</p></section><section class="loginPanel"><div class="loginCard card"><div class="brand">${logo()}SınıfDenizi</div><h2>Hoş geldiniz</h2><div class="tabs"><button class="active" data-r="teacher">Öğretmen</button><button data-r="parent">Veli</button></div><div class="field"><label>E-posta</label><input value="ogretmen@sinifdenizi.com"></div><div class="field"><label>Şifre</label><input type="password" value="demo1234"></div><button id="go" class="btn primary" style="width:100%">Giriş Yap</button><p class="muted">Demo sürümü — giriş bilgileri örnektir.</p></div></section></div>`;let role='teacher';document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('active',x===b))});go.onclick=()=>{s.role=role;save();role==='teacher'?teacher():parent()}}
const nav=(t,p)=>`<button data-p="${p}" class="${page===p?'active':''}">${t}</button>`;function shell(body){cancelAnimationFrame(anim);agents=[];app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">${logo()}SınıfDenizi</div><div class="nav">${nav('Ana Sayfa','dashboard')}${nav('Sınıf Akvaryumu','aquarium')}${nav('Öğrenciler','students')}${nav('Görevler','tasks')}${nav('Rozetler','badges')}${nav('Raporlar','reports')}</div><div class="sideBottom"><b>${s.teacher}</b><br><small>Sınıf Öğretmeni</small><br><button id="out" class="btn secondary" style="margin-top:12px">Çıkış</button></div></aside><main class="main"><header class="topbar"><span class="chip">${s.className}</span><span class="chip">Seviye ${s.decor}</span><span class="chip">${s.students.length} Öğrenci</span><span class="chip">${s.tasks.length} Görev</span><div class="spacer"></div><button id="fullTop" class="btn secondary">Tam Ekran</button></header><div class="content">${body}</div></main></div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;teacher()});out.onclick=login;fullTop.onclick=()=>{page='aquarium';teacher();setTimeout(fullscreen,100)}}
const metric=(a,b)=>`<div class="metric card"><strong>${a}</strong><span>${b}</span></div>`;function teacher(){({dashboard,aquarium,students,tasks,badges,reports}[page]||dashboard)()}
function dashboard(){shell(`<div class="title"><div><h2>Merhaba, ${s.teacher.split(' ')[0]} Öğretmen</h2><div class="muted">Sınıfınızın güncel durumu</div></div><button class="btn primary" onclick="taskModal()">+ Yeni Görev</button></div><div class="grid g4">${metric(s.students.length,'Öğrenci')}${metric(s.tasks.length,'Aktif görev')}${metric('%'+s.participation,'Katılım')}${metric(s.students.reduce((a,x)=>a+x.feed,0),'Toplam yem')}</div><h2>Sınıf Akvaryumu</h2><div class="panel card"><div id="aq" class="aquarium" style="height:450px"></div></div>`);setTimeout(()=>makeAq('aq'),30)}
function aquarium(){shell(`<div class="title"><div><h2>Sınıf Akvaryumu</h2><div class="muted">Balıklar bağımsız rotalarda serbestçe yüzer ve birbirlerinden kaçınır.</div></div></div><div class="aqTools"><button class="btn secondary" onclick="feedAll()">Yem Ver</button><button class="btn secondary" onclick="decorModal()">Dekorasyonlar</button><button class="btn primary" onclick="fullscreen()">Tam Ekran</button></div><div id="aq" class="aquarium"></div><h2>Toplu başarı</h2><div class="grid g3">${['Başlangıç','Keşif','Gelişim','Zenginleşme','Işıltılı Deniz','Efsane Akvaryum'].map((x,i)=>`<div class="panel card"><b>Seviye ${i+1}</b><h3>${x}</h3><div class="muted">${i<s.decor?'Açıldı':'Sınıf başarısıyla açılır'}</div></div>`).join('')}</div>`);setTimeout(()=>makeAq('aq'),30)}
function makeAq(id){const aq=document.getElementById(id);if(!aq)return;aq.innerHTML='<div class="waterGlow"></div><div class="seabed"></div><div class="wreck"></div><div class="treasure"></div>';[[8,'rock'],[78,'rock'],[15,'plant'],[24,'coral'],[68,'plant'],[86,'coral'],[55,'plant']].forEach((x,i)=>{let e=document.createElement('div');e.className=x[1];e.style.left=x[0]+'%';if(x[1]==='plant')e.style.transform=`rotate(${i%2?8:-8}deg)`;aq.append(e)});for(let i=0;i<22;i++){let b=document.createElement('i');b.className='bubble';let z=7+Math.random()*14;b.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;bottom:${Math.random()*120}px;animation-duration:${6+Math.random()*8}s`;aq.append(b)}const r=aq.getBoundingClientRect();agents=s.students.map(st=>{let el=document.createElement('div');el.className='fishAgent';el.innerHTML=`<span class="fishTag">${st.name} · Sv.${st.level}</span>${fishSVG(st.fish)}`;aq.append(el);return{el,x:30+Math.random()*(r.width-150),y:45+Math.random()*(r.height-180),vx:(Math.random()>.5?1:-1)*(0.55+Math.random()*.75),vy:(Math.random()-.5)*.5}});function tick(){const box=aq.getBoundingClientRect();for(const a of agents){for(const b of agents){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<115&&d>0){a.vx+=dx/d*.012;a.vy+=dy/d*.009}}if(a.x<15)a.vx+=.035;if(a.x>box.width-125)a.vx-=.035;if(a.y<22)a.vy+=.026;if(a.y>box.height-150)a.vy-=.026;a.vx=Math.max(-1.45,Math.min(1.45,a.vx));a.vy=Math.max(-.8,Math.min(.8,a.vy));a.x+=a.vx;a.y+=a.vy;a.el.style.transform=`translate(${a.x}px,${a.y}px) scaleX(${a.vx<0?-1:1})`}anim=requestAnimationFrame(tick)}tick()}
function fullscreen(){let aq=document.getElementById('aq');if(!aq)return;aq.classList.toggle('fullscreen');setTimeout(()=>makeAq('aq'),80)}function feedAll(){s.students.forEach(x=>x.feed++);save();alert('Balıklar beslendi.')}function students(){shell(`<div class="title"><h2>Öğrenciler</h2><button class="btn primary" onclick="studentModal()">+ Öğrenci Ekle</button></div><div class="panel card"><table class="table"><thead><tr><th>Öğrenci</th><th>Balık</th><th>Seviye</th><th>Görev</th><th>Yem</th></tr></thead><tbody>${s.students.map(x=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="avatar">${x.photo?`<img src="${x.photo}">`:x.name.split(' ').map(y=>y[0]).join('').slice(0,2)}</div><b>${x.name}</b></div></td><td><div style="width:90px">${fishSVG(x.fish)}</div><small>${TYPE_NAMES[x.fish]}</small></td><td>${x.level}</td><td>${x.completed}</td><td>${x.feed}</td></tr>`).join('')}</tbody></table></div>`)}
function tasks(){shell(`<div class="title"><h2>Görevler</h2><button class="btn primary" onclick="taskModal()">+ Yeni Görev</button></div>${s.tasks.map(t=>`<div class="panel card row"><div class="grow"><b>${t.title}</b><div class="muted">${t.type} · ${t.due}</div></div><span class="badge">+${t.xp} XP</span><span class="badge">+${t.feed} yem</span></div>`).join('')}`)}function badges(){shell(`<div class="title"><h2>Rozetler & Sınıf Hedefleri</h2></div><div class="grid g3">${['İlk Görev','Kitap Kurdu','Süper Katılım','Yardımsever','Hedef Ustası','Deniz Kaşifi'].map((x,i)=>`<div class="panel card"><div style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffd65b,#ff9d35);color:#fff;font-size:26px;font-weight:900">${i+1}</div><h3>${x}</h3><div class="muted">Başarılarla açılır</div></div>`).join('')}</div>`)}function reports(){shell(`<div class="title"><h2>Raporlar</h2></div><div class="grid g3">${metric('%'+s.participation,'Ortalama katılım')}${metric(s.students.reduce((a,x)=>a+x.completed,0),'Tamamlanan görev')}${metric(s.students.reduce((a,x)=>a+x.badges,0),'Toplam rozet')}</div><div class="panel card" style="margin-top:16px"><h3>En aktif öğrenciler</h3>${[...s.students].sort((a,b)=>b.completed-a.completed).slice(0,6).map((x,i)=>`<div class="row"><b>${i+1}</b><div class="grow">${x.name}</div><b>${x.completed} görev</b></div>`).join('')}</div>`)}
function modal(html){let d=document.createElement('div');d.className='modalBg';d.innerHTML=`<div class="modal"><div style="display:flex"><b>SınıfDenizi</b><div class="spacer"></div><button class="btn secondary" onclick="this.closest('.modalBg').remove()">×</button></div>${html}</div>`;document.body.append(d);return d}function taskModal(){let m=modal(`<h2>Yeni Görev</h2><div class="field"><label>Başlık</label><input id="tt"></div><div class="field"><label>Tür</label><select id="ty"><option>Ödev</option><option>Okuma</option><option>Katılım</option><option>Proje</option></select></div><div class="grid g3"><div class="field"><label>XP</label><input id="tx" type="number" value="50"></div><div class="field"><label>Yem</label><input id="tf" type="number" value="10"></div><div class="field"><label>Son tarih</label><input id="td" value="27 Eylül"></div></div><button id="ts" class="btn primary">Kaydet</button>`);m.querySelector('#ts').onclick=()=>{let title=m.querySelector('#tt').value.trim();if(!title)return;s.tasks.push({title,type:m.querySelector('#ty').value,xp:+m.querySelector('#tx').value,feed:+m.querySelector('#tf').value,due:m.querySelector('#td').value});save();m.remove();teacher()}}
function studentModal(){let photo='',fish='clown';let m=modal(`<h2>Yeni Öğrenci</h2><div class="field"><label>Ad Soyad</label><input id="sn"></div><div class="field"><label>Profil Fotoğrafı</label><input id="sp" type="file" accept="image/*"></div><div class="field"><label>Balık seç</label><div class="fishPicker">${TYPES.map((f,i)=>`<button data-f="${f}" class="fishPick ${i?'':'sel'}">${fishSVG(f)}<small>${TYPE_NAMES[f]}</small></button>`).join('')}</div></div><button id="ss" class="btn primary">Öğrenciyi Kaydet</button>`);m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fish=b.dataset.f;m.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('sel',x===b))});m.querySelector('#sp').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>photo=r.result;r.readAsDataURL(f)};m.querySelector('#ss').onclick=()=>{let name=m.querySelector('#sn').value.trim();if(!name)return;s.students.push({id:Date.now(),name,fish,photo,level:1,completed:0,feed:0,badges:0});save();m.remove();teacher()}}
function decorModal(){modal(`<h2>Akvaryum Dekorasyonları</h2><p class="muted">Dekorasyonlar sınıfın toplu başarısıyla otomatik açılır.</p><div class="grid g3">${['Kaya Grubu','Deniz Bitkileri','Mercan Resifi','Batık Gemi','Hazine Sandığı','Deniz Kalesi'].map((x,i)=>`<div class="panel card"><b>${x}</b><div class="muted" style="margin-top:8px">${i<s.decor?'Açıldı':'Kilitli'}</div></div>`).join('')}</div>`)}
function parent(){let x=s.students[0];app.innerHTML=`<div class="parent"><header style="display:flex;align-items:center;margin-bottom:18px"><div class="brand">${logo()}SınıfDenizi</div><div class="spacer"></div><button class="btn secondary" onclick="login()">Çıkış</button></header><div class="parentHero"><div class="avatar">${x.photo?`<img src="${x.photo}">`:x.name.split(' ').map(y=>y[0]).join('')}</div><div><small>Çocuğunuzun gelişimi</small><h1 style="margin:4px 0">${x.name}</h1><div>${s.className} · Seviye ${x.level}</div></div><div class="spacer"></div><div style="width:130px">${fishSVG(x.fish)}</div></div><div class="grid g4" style="margin-top:16px">${metric(x.completed,'Tamamlanan görev')}${metric(4,'Bekleyen görev')}${metric(x.badges,'Rozet')}${metric(x.feed,'Yem')}</div><div class="grid g3" style="margin-top:16px"><div class="panel card" style="grid-column:span 2"><h2>Görev durumu</h2>${s.tasks.map((t,i)=>`<div class="row"><div class="grow"><b>${t.title}</b><div class="muted">${i?'Devam ediyor':'Tamamlandı'} · ${t.due}</div></div></div>`).join('')}</div><div class="panel card"><h2>Öğretmenden</h2><p>${x.name.split(' ')[0]} düzenli ilerliyor ve görev katılımı oldukça güzel.</p></div></div><div class="panel card" style="margin-top:16px"><h2>Sınıf Denizi</h2><div id="paq" class="aquarium" style="height:390px"></div></div></div>`;setTimeout(()=>makeAq('paq'),30)}login();
</script></body></html>
